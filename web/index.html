<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mahmuod Murad Flutter Developer">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_portifolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MahmuodMurad</title>
  <link rel="manifest" href="manifest.json">
<style>
    body {
      background-color: #0A0E21;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #loading-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .wheel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Match the Flutter _horizontalSlide animation: -1.5 -> 0.0 */
      animation: rollIn 3.5s cubic-bezier(0.21, 0.6, 0.35, 1) forwards;
    }
    .wheel {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid #00D9FF;
      box-shadow: 
        0 0 30px rgba(0, 217, 255, 0.5), 
        0 8px 40px rgba(255, 107, 0, 0.3);
      overflow: hidden;
      background-color: #1A1F3A;
      /* Match the Flutter _rotation animation: 0 -> 6 * pi (1080 deg) */
      animation: spin 3.5s cubic-bezier(0.21, 0.6, 0.35, 1) forwards;
    }
    .wheel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @keyframes rollIn {
      0% { transform: translateX(-150vw); }
      100% { transform: translateX(0); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(1080deg); }
    }
    @media (max-width: 600px) {
      .wheel {
        width: 130px;
        height: 130px;
      }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="wheel-container">
      <div class="wheel">
        <img src="assets/assets/images/myimage.jpeg" alt="Loading...">
      </div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
